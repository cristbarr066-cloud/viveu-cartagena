<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo | ViveU Cartagena</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #09090b 0%, #18181b 50%, #09090b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #f4f4f5;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .admin-card {
            background: rgba(24, 24, 27, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(124, 58, 237, 0.3);
            border-radius: 20px;
            padding: 2.75rem 2.25rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px rgba(124, 58, 237, 0.15);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .admin-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #7c3aed, #a855f7, #c084fc);
        }
        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(124, 58, 237, 0.15);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1.25rem;
        }
        .admin-input {
            background: #18181b;
            border: 1px solid #3f3f46;
            color: #fafafa;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            width: 100%;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
            margin-top: 0.35rem;
        }
        .admin-input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.25);
            background: #27272a;
        }
        .admin-btn {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: #ffffff;
            border: none;
            padding: 0.9rem;
            border-radius: 10px;
            width: 100%;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
            box-shadow: 0 4px 14px rgba(124, 58, 237, 0.4);
        }
        .admin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.6);
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <!-- Logo con reflejo -->
        <div style="margin-bottom: 1rem;">
            <img th:src="@{/images/logo-viveu.png}" alt="Logo ViveU" style="max-height: 48px; filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.4));">
        </div>

        <div class="admin-badge">
            🔒 Área Restringida • Equipo ViveU
        </div>

        <h1 style="font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 800; margin-bottom: 0.4rem; color: #ffffff;">
            Panel de Validación y Moderación
        </h1>
        <p style="font-size: 0.85rem; color: #a1a1aa; margin-bottom: 1.75rem;">
            Verificación de identidad de nuevos alojadores y control de seguridad estudiantil.
        </p>

        <!-- Mensaje de error si falla la autenticación -->
        <div th:if="${errorMsg}" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 0.85rem; border-radius: 10px; margin-bottom: 1.25rem; font-size: 0.85rem; text-align: left;">
            ⚠️ <span th:text="${errorMsg}"></span>
        </div>

        <form th:action="@{/admin/login}" method="post" style="text-align: left;">
            <div style="margin-bottom: 1.15rem;">
                <label style="font-size: 0.82rem; font-weight: 600; color: #d4d4d8; text-transform: uppercase; letter-spacing: 0.04em;">Usuario Administrador</label>
                <input type="text" name="usuario" required placeholder="admin" class="admin-input" autofocus>
            </div>

            <div style="margin-bottom: 1.25rem;">
                <label style="font-size: 0.82rem; font-weight: 600; color: #d4d4d8; text-transform: uppercase; letter-spacing: 0.04em;">Contraseña de Seguridad</label>
                <input type="password" name="password" required placeholder="••••••••" class="admin-input">
            </div>

            <button type="submit" class="admin-btn">
                <span>🛡️</span> Ingresar al Panel de Control
            </button>
        </form>

        <!-- Pista de credenciales -->
        <div style="margin-top: 1.75rem; background: rgba(39, 39, 42, 0.6); border: 1px dashed #52525b; border-radius: 10px; padding: 0.85rem; font-size: 0.78rem; color: #a1a1aa; text-align: left;">
            <div style="color: #c084fc; font-weight: 700; margin-bottom: 0.2rem;">🔑 Credenciales de Acceso:</div>
            <div><strong>Usuario:</strong> <code>admin</code> (o <code>admin@viveu.com</code>)</div>
            <div><strong>Contraseña:</strong> <code>viveu2026</code> (o <code>admin</code>)</div>
        </div>

        <div style="margin-top: 1.5rem;">
            <a th:href="@{/}" style="color: #a1a1aa; font-size: 0.82rem; text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='#f4f4f5'" onmouseout="this.style.color='#a1a1aa'">
                ← Volver al portal público de ViveU
            </a>
        </div>
    </div>

</body>
</html>
