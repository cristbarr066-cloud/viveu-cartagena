# Configuración del servidor
server.port=${PORT:8080}
spring.application.name=ViveU-Cartagena

# Configuración Base de Datos H2 en Memoria
spring.datasource.url=jdbc:h2:mem:viveudb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola H2 para inspección
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Codificación general
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
